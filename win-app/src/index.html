<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <!-- CSP 由主进程按配置注入（main.js setupCsp），此处不再硬编码服务器地址 -->
  <title>技遇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 启动动画 -->
  <div id="splash" class="splash">
    <div class="splash-logo">⇄</div>
    <div class="splash-title">技遇</div>
    <div class="splash-sub">纯公益 · 无金钱交易的技能互换平台</div>
    <div class="splash-bar"><div class="splash-bar-inner"></div></div>
  </div>

  <!-- 登录页 -->
  <div id="login-page" class="page center-page hidden">
    <div class="login-card">
      <div class="brand-icon">⇄</div>
      <h1 class="brand-title">技遇</h1>
      <p class="brand-subtitle">纯公益 · 无金钱交易的技能互换平台</p>

      <div id="saved-accounts" class="saved-accounts hidden"></div>

      <div class="field">
        <input id="login-username" type="text" placeholder="用户名" autocomplete="off">
      </div>
      <div class="field">
        <input id="login-password" type="password" placeholder="密码（至少 6 位）">
      </div>
      <div id="register-field" class="field hidden">
        <input id="login-nickname" type="text" placeholder="昵称">
      </div>
      <div id="register-phone-field" class="field hidden">
        <input id="login-phone" type="tel" placeholder="手机号（选填，填写则需验证码）" maxlength="11" autocomplete="off">
      </div>
      <div id="register-code-field" class="field hidden">
        <div style="display:flex;gap:8px">
          <input id="login-code" type="text" placeholder="手机验证码" maxlength="6" style="flex:1" autocomplete="off">
          <button id="send-code-btn" class="btn btn-outline" style="white-space:nowrap">获取验证码</button>
        </div>
      </div>
      <div id="login-error" class="error-text hidden"></div>
      <button id="login-submit" class="btn btn-primary btn-block">登 录</button>
      <div class="login-links">
        <button id="login-toggle" class="btn-link">没有账号？注册一个</button>
        <button id="forgot-btn" class="btn-link">忘记密码？</button>
      </div>
      <p class="hint" id="server-hint">服务地址：http://43.157.17.88:3000（体验账号 aqing / 123456）</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-icon-small">⇄</span> 技遇</div>
      <nav class="side-nav">
        <button class="tab active" data-view="match"><span class="tab-icon">⚡</span><span>技能匹配</span></button>
        <button class="tab" data-view="feed"><span class="tab-icon">📢</span><span>互换动态</span></button>
        <button class="tab" data-view="message"><span class="tab-icon">💬</span><span>消息</span><span id="msg-badge" class="badge hidden"></span></button>
        <button class="tab" data-view="pet"><span class="tab-icon">🐾</span><span>宠物</span></button>
        <button class="tab" data-view="mine"><span class="tab-icon">👤</span><span>我的</span></button>
      </nav>
      <div class="sidebar-promo" id="sidebar-promo">
        <div class="promo-icon">🛒</div>
        <div class="promo-title">小程序市场</div>
        <div class="promo-sub">消息页进入 · 人人可发布</div>
        <button class="promo-btn" id="promo-btn">去看看</button>
      </div>
    </aside>

    <!-- 右侧：顶栏 + 内容区 -->
    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">技遇</div>
        <div class="topbar-right">
          <span id="conn-status" class="conn-status conn-off">连接中…</span>
          <button class="bell-btn" id="bell-btn" title="消息通知">🔔<span id="bell-dot" class="bell-dot hidden"></span></button>
          <div class="user-menu" id="user-menu">
            <span id="topbar-avatar" class="topbar-avatar"></span>
            <span id="topbar-user-name" class="topbar-username"></span>
            <span class="caret">▾</span>
            <div class="user-dropdown hidden" id="user-dropdown">
              <button class="dropdown-item" id="check-update-btn" style="color:var(--text)">🔄 检查更新</button>
              <button class="dropdown-item" id="logout-btn">🚪 退出登录</button>
            </div>
          </div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- 全局弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="../node_modules/leaflet/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="views.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
