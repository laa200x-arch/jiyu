<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://43.157.17.88:3000 data: blob:; img-src 'self' http://43.157.17.88:3000 data: blob:; media-src 'self' http://43.157.17.88:3000 blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://43.157.17.88:3000 ws://43.157.17.88:3000">
  <title>技遇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-page" class="page center-page hidden">
    <div class="login-card">
      <div class="brand-icon">⇄</div>
      <h1 class="brand-title">技遇</h1>
      <p class="brand-subtitle">纯公益 · 无金钱交易的技能互换平台</p>

      <div id="saved-accounts" class="saved-accounts hidden"></div>

      <div class="field">
        <input id="login-username" type="text" placeholder="用户名" autocomplete="off">
      </div>
      <div class="field">
        <input id="login-password" type="password" placeholder="密码（至少 6 位）">
      </div>
      <div id="register-field" class="field hidden">
        <input id="login-nickname" type="text" placeholder="昵称">
      </div>
      <div id="register-phone-field" class="field hidden">
        <input id="login-phone" type="tel" placeholder="手机号（11 位，每个手机号仅可注册一个账号）" maxlength="11" autocomplete="off">
      </div>
      <div id="register-code-field" class="field hidden">
        <div style="display:flex;gap:8px">
          <input id="login-code" type="text" placeholder="手机验证码" maxlength="6" style="flex:1" autocomplete="off">
          <button id="send-code-btn" class="btn btn-outline" style="white-space:nowrap">获取验证码</button>
        </div>
      </div>
      <div id="login-error" class="error-text hidden"></div>
      <button id="login-submit" class="btn btn-primary btn-block">登 录</button>
      <button id="login-toggle" class="btn-link">没有账号？注册一个</button>
      <p class="hint">服务地址：http://43.157.17.88:3000（演示账号 aqing / 123456）</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-brand"><span class="brand-icon-small">⇄</span> 技遇</div>
      <div class="topbar-user">
        <span id="topbar-user-name"></span>
        <button id="logout-btn" class="btn-link" title="切换账号 / 退出登录">切换账号</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <!-- 底部导航（匹配/动态/消息/宠物/我的） -->
    <nav class="bottombar">
      <button class="tab active" data-view="match"><span class="tab-icon">⚡</span><span>匹配</span></button>
      <button class="tab" data-view="feed"><span class="tab-icon">📢</span><span>动态</span></button>
      <button class="tab" data-view="message"><span class="tab-icon">💬</span><span>消息</span><span id="msg-badge" class="badge hidden"></span></button>
      <button class="tab" data-view="pet"><span class="tab-icon">🐾</span><span>宠物</span></button>
      <button class="tab" data-view="mine"><span class="tab-icon">👤</span><span>我的</span></button>
    </nav>
  </div>

  <!-- 全局弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="api.js"></script>
  <script src="views.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
