name: Server Tests

# 后端自动测试：push / PR 时在临时 sqlite 库上运行端到端 + 单元测试
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22（node:sqlite 需要 22.5+，与生产环境一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试（临时库，不打线上）
        run: npm test
