name: Build IPA

# 云端自动打包：在 GitHub 的 macOS 服务器上编译「技遇」并产出 .ipa 安装包
# 触发方式：
#   1. 手动：仓库 Actions 页面 → Build IPA → Run workflow
#   2. 自动：push 到 main 分支
# 产出：Actions 页面 → 本次运行 → Artifacts → 下载 Jiyu-unsigned.ipa
# 说明：产物为「未签名」安装包，配合 Windows 上的 Sideloadly 用你的 Apple ID
#       免费签名安装到 iPhone（个人免费签名 7 天有效，到期重新安装即可）。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 列出可用 Xcode（调试用）
        run: xcodebuild -version

      - name: 编译 Release（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Jiyu.xcodeproj \
            -scheme Jiyu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: 错误摘要（构建失败时自动输出）
        if: failure()
        run: |
          echo "===== 1) 所有 error:/fatal: 行（含上下文） ====="
          grep -n -B 2 -A 4 -E "error:|fatal" xcodebuild.log || echo "(日志中没有 error: 行)"
          echo ""
          echo "===== 2) 日志末尾 60 行 ====="
          tail -n 60 xcodebuild.log
          exit 0

      - name: 打包 .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Jiyu.app" "Payload/Jiyu.app"
          zip -qry Jiyu-unsigned.ipa Payload
          ls -lh Jiyu-unsigned.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Jiyu-unsigned-ipa
          path: Jiyu-unsigned.ipa
          if-no-files-found: error
