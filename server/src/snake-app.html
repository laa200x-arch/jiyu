<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<!-- 技遇小程序示例：单文件自包含（无外部依赖、无网络请求），符合小程序格式规范 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1b1e3a 0%, #2d2f56 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    color: #fff; user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 22px; margin: 14px 0 4px; letter-spacing: 2px;
       background: linear-gradient(90deg, #33d1d9, #3f8cd9); -webkit-background-clip: text;
       -webkit-text-fill-color: transparent; }
  .sub { font-size: 12px; color: rgba(255,255,255,.45); margin-bottom: 10px; }
  .wrap { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
          border-radius: 16px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  canvas { display: block; border-radius: 10px; background: #14162e;
           touch-action: none; }
  .bar { display: flex; justify-content: space-between; align-items: center;
         width: 100%; max-width: 320px; margin-top: 12px; font-size: 13px; color: rgba(255,255,255,.8); }
  .score { font-size: 18px; font-weight: 700; color: #33d1d9; }
  .btn { padding: 8px 20px; border: none; border-radius: 20px; font-size: 14px; cursor: pointer;
         background: linear-gradient(90deg, #33d1d9, #3f8cd9); color: #fff; font-weight: 600;
         box-shadow: 0 4px 14px rgba(63,140,217,.35); }
  .btn:active { transform: scale(.95); }
  .hint { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,.35); }
  .over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: rgba(10,12,30,.75); backdrop-filter: blur(4px); z-index: 10; }
  .over.show { display: flex; }
  .over-card { text-align: center; }
  .over-card .t { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .over-card .s { color: rgba(255,255,255,.6); font-size: 14px; margin-bottom: 16px; }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="sub">方向键 / 滑动控制 · 吃食物成长</div>
  <div class="wrap"><canvas id="c" width="320" height="320"></canvas></div>
  <div class="bar">
    <span>得分 <span class="score" id="score">0</span></span>
    <button class="btn" id="btn">开始</button>
  </div>
  <div class="hint">先点击游戏画面获得键盘焦点 · 方向键 / 滑动控制 · 撞墙或撞到自己结束</div>
  <div class="over" id="over">
    <div class="over-card">
      <div class="t">💀 游戏结束</div>
      <div class="s" id="final">得分 0</div>
      <button class="btn" id="again">再来一局</button>
    </div>
  </div>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d')
  var N = 20, SIZE = 320 / N, scoreEl = document.getElementById('score')
  var over = document.getElementById('over'), finalEl = document.getElementById('final')
  var snake, dir, nextDir, food, score, speed, timer, running = false

  function init() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }]
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; speed = 150
    scoreEl.textContent = '0'; over.classList.remove('show')
    placeFood(); running = true
    clearInterval(timer); timer = setInterval(step, speed)
    draw()
  }
  function placeFood() {
    do { food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 } }
    while (snake.some(function (s) { return s.x === food.x && s.y === food.y }))
  }
  function step() {
    dir = nextDir
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y }
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y })) return gameOver()
    snake.unshift(head)
    if (head.x === food.x && head.y === food.y) {
      score += 10; scoreEl.textContent = score
      if (speed > 70) { speed -= 4; clearInterval(timer); timer = setInterval(step, speed) }
      placeFood()
    } else snake.pop()
    draw()
  }
  function draw() {
    ctx.clearRect(0, 0, 320, 320)
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++)
      if ((i + j) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fillRect(i * SIZE, j * SIZE, SIZE, SIZE) }
    ctx.fillStyle = '#ff6b6b'; ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 8
    ctx.beginPath(); ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 3, 0, 7)
    ctx.fill(); ctx.shadowBlur = 0
    snake.forEach(function (s, i) {
      var g = Math.max(0.35, 1 - i * 0.025)
      ctx.fillStyle = i === 0 ? '#33d1d9' : 'rgba(63,140,217,' + g + ')'
      roundRect(s.x * SIZE + 1.5, s.y * SIZE + 1.5, SIZE - 3, SIZE - 3, 5); ctx.fill()
    })
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath()
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r)
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath()
  }
  function gameOver() {
    running = false; clearInterval(timer)
    finalEl.textContent = '得分 ' + score
    over.classList.add('show')
    // 上报分数给宿主（小程序桥接：宿主监听 postMessage 提交排行榜）
    try { window.parent.postMessage({ type: 'jiyuScore', score: score }, '*') } catch (e) { /* 独立打开时忽略 */ }
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key
    if (k === 'ArrowUp' && dir.y !== 1) nextDir = { x: 0, y: -1 }
    else if (k === 'ArrowDown' && dir.y !== -1) nextDir = { x: 0, y: 1 }
    else if (k === 'ArrowLeft' && dir.x !== 1) nextDir = { x: -1, y: 0 }
    else if (k === 'ArrowRight' && dir.x !== -1) nextDir = { x: 1, y: 0 }
  })
  var sx = 0, sy = 0
  cv.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY }, { passive: true })
  cv.addEventListener('touchmove', function (e) { e.preventDefault() }, { passive: false })
  cv.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return
    if (Math.abs(dx) > Math.abs(dy)) nextDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 }
    else nextDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 }
  }, { passive: true })
  document.getElementById('btn').addEventListener('click', init)
  document.getElementById('again').addEventListener('click', init)
  init()
})()
</script>
</body>
</html>
